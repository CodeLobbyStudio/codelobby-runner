name: codelobby-runner-modern
services:
  server:
    image: ghcr.io/ptrthdr/codelobby-judge0@sha256:df4b929480326646edc449c3df7fa52562c0a55ce773529084efc3b819ed8970
    pull_policy: missing
    platform: linux/amd64
    command: ["/bin/bash", "/usr/local/bin/start-without-env-log.sh", "server"]
    volumes:
      - ${JUDGE0_CONFIG_FILE:-./judge0.conf}:/judge0.conf:ro
    ports:
      - "127.0.0.1:${JUDGE0_PORT:-2359}:2358"
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2358/about"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    image: ghcr.io/ptrthdr/codelobby-judge0@sha256:df4b929480326646edc449c3df7fa52562c0a55ce773529084efc3b819ed8970
    pull_policy: missing
    platform: linux/amd64
    command: ["/bin/bash", "/usr/local/bin/start-without-env-log.sh", "workers"]
    environment:
      ISOLATE_CGROUP_ROOT: /sys/fs/cgroup/codelobby-runner-judge0-v1
    volumes:
      - ${JUDGE0_CONFIG_FILE:-./judge0.conf}:/judge0.conf:ro
    privileged: true
    cgroup: host
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16.2@sha256:4aea012537edfad80f98d870a36e6b90b4c09b27be7f4b4759d72db863baeebb
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate judge0.conf with start.sh}
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2.4@sha256:5a93f6b2e391b78e8bd3f9e7e1e1e06aeb5295043b4703fb88392835cec924a0
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate judge0.conf with start.sh}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  judge0-data:
