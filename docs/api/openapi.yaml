openapi: 3.1.1
info:
  title: CodeLobby Runner Internal API
  version: 1.0.0-draft.2
  description: 'Revised unpublished v1 draft for host-defined multi-file tasks in
    JAVA, CPP and PYTHON. File roles: EDITABLE, READ_ONLY, VISIBLE_TEST, HIDDEN_TEST.
    Run evaluates all public test suites; Submit evaluates public and hidden suites.
    Public means visible descriptions/results, never test-source access. Both test
    roles remain backend-to-runner only; backend owns descriptions joined by testId.
    See CONTRACT.md for normative assembly, execution, report integrity and redaction
    rules. Not an implementation claim.'
servers:
- url: http://127.0.0.1:8081
  description: Local development only; production requires authenticated TLS transport
    or an equivalent protected service channel.
security:
- InternalKey: []
tags:
- name: Evaluation
- name: Capabilities
paths:
  /internal/v1/runs:
    post:
      operationId: runPublicTests
      summary: Synchronously evaluate all public tests
      tags:
      - Evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              run-request:
                value:
                  requestId: run-001
                  taskVersionId: task-v2
                  language: JAVA
                  taskFiles:
                  - &id001
                    path: src/Solution.java
                    type: EDITABLE
                    content: "public class Solution {\n    public static int countVowels(String\
                      \ text) { return 0; }\n}\n"
                  - &id002
                    path: src/Helpers.java
                    type: READ_ONLY
                    content: "public class Helpers {\n    public static int count(String\
                      \ text) {\n        int n = 0;\n        for (char c : text.toCharArray())\
                      \ if (\"aeiou\".indexOf(c) >= 0) n++;\n        return n;\n \
                      \   }\n}\n"
                  - &id003
                    path: tests/PublicTests.java
                    type: VISIBLE_TEST
                    content: "import java.nio.file.Files;\nimport java.nio.file.Path;\n\
                      public class PublicTests {\n    public static void main(String[]\
                      \ args) throws Exception {\n        int actual = Solution.countVowels(\"\
                      codelobby\");\n        String status = actual == 3 ? \"ACCEPTED\"\
                      \ : \"WRONG_ANSWER\";\n        String record = \"{\\\"testId\\\
                      \":\\\"public-1\\\",\\\"status\\\":\\\"\" + status\n       \
                      \     + \"\\\",\\\"input\\\":{\\\"text\\\":\\\"codelobby\\\"\
                      },\\\"expectedOutput\\\":3,\\\"actualOutput\\\":\" + actual\
                      \ + \"}\\n\";\n        Files.writeString(Path.of(System.getenv(\"\
                      CODELOBBY_REPORT_PATH\")), record);\n    }\n}\n"
                  submissionFiles:
                  - path: src/Solution.java
                    content: "public class Solution {\n    public static int countVowels(String\
                      \ text) { return Helpers.count(text); }\n}\n"
                  testSuites:
                  - &id004
                    suiteId: public-suite
                    visibility: PUBLIC
                    testFilePaths:
                    - tests/PublicTests.java
                    execution:
                      profile: JAVA_MAIN
                      mainClass: PublicTests
                    cases:
                    - testId: public-1
                  limits:
                    cpuTimeMs: 2000
                    wallTimeMs: 5000
                    memoryLimitBytes: 128000000
              run-request-cpp:
                value:
                  requestId: run-cpp-001
                  taskVersionId: task-v2
                  language: CPP
                  taskFiles:
                  - path: src/solution.cpp
                    type: EDITABLE
                    content: 'int twice(int value) { return 0; }

                      '
                  - path: include/solution.h
                    type: READ_ONLY
                    content: '#pragma once

                      int twice(int value);

                      '
                  - path: tests/public_tests.cpp
                    type: VISIBLE_TEST
                    content: "#include \"solution.h\"\n#include <cstdlib>\n#include\
                      \ <fstream>\nint main() {\n    int actual = twice(4);\n    std::ofstream\
                      \ report(std::getenv(\"CODELOBBY_REPORT_PATH\"));\n    report\
                      \ << \"{\\\"testId\\\":\\\"cpp-public-1\\\",\\\"status\\\":\\\
                      \"\"\n           << (actual == 8 ? \"ACCEPTED\" : \"WRONG_ANSWER\"\
                      )\n           << \"\\\",\\\"input\\\":4,\\\"expectedOutput\\\
                      \":8,\\\"actualOutput\\\":\" << actual << \"}\\n\";\n}\n"
                  submissionFiles:
                  - path: src/solution.cpp
                    content: 'int twice(int value) { return value * 2; }

                      '
                  testSuites:
                  - suiteId: cpp-public
                    visibility: PUBLIC
                    testFilePaths:
                    - tests/public_tests.cpp
                    execution:
                      profile: CPP_MAIN
                      mainSourcePath: tests/public_tests.cpp
                    cases:
                    - testId: cpp-public-1
                  limits:
                    cpuTimeMs: 2000
                    wallTimeMs: 5000
                    memoryLimitBytes: 128000000
              run-request-python:
                value:
                  requestId: run-python-001
                  taskVersionId: task-v2
                  language: PYTHON
                  taskFiles:
                  - path: src/solution.py
                    type: EDITABLE
                    content: "def square(value):\n    return 0\n"
                  - path: src/helpers.py
                    type: READ_ONLY
                    content: "def identity(value):\n    return value\n"
                  - path: tests/public_tests.py
                    type: VISIBLE_TEST
                    content: 'import json, os, sys

                      from pathlib import Path

                      sys.path.insert(0, str(Path.cwd() / "src"))

                      from solution import square

                      actual = square(4)

                      record = {"testId": "py-public-1", "status": "ACCEPTED" if actual
                      == 16 else "WRONG_ANSWER", "input": 4, "expectedOutput": 16,
                      "actualOutput": actual}

                      Path(os.environ["CODELOBBY_REPORT_PATH"]).write_text(json.dumps(record)
                      + "\n", encoding="utf-8")

                      '
                  submissionFiles:
                  - path: src/solution.py
                    content: "def square(value):\n    return value * value\n"
                  testSuites:
                  - suiteId: py-public
                    visibility: PUBLIC
                    testFilePaths:
                    - tests/public_tests.py
                    execution:
                      profile: PYTHON_SCRIPT
                      scriptPath: tests/public_tests.py
                    cases:
                    - testId: py-public-1
                  limits:
                    cpuTimeMs: 2000
                    wallTimeMs: 5000
                    memoryLimitBytes: 128000000
      responses:
        '200':
          description: Completed evaluation, including negative solution verdicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
              examples:
                run-accepted:
                  value:
                    requestId: run-001
                    taskVersionId: task-v2
                    contractVersion: 1.0.0-draft.2
                    result:
                      status: ACCEPTED
                      passedTests: 1
                      totalTests: 1
                      testResults:
                      - testId: public-1
                        suiteId: public-suite
                        visibility: PUBLIC
                        status: ACCEPTED
                        input:
                          text: codelobby
                        expectedOutput: 3
                        actualOutput: 3
                        stdout: null
                        stderr: null
                      compileOutput: ''
                      message: null
                      sandboxCpuTimeMs: 90.0
                      sandboxPeakMemoryBytes: 42000000
                      benchmark:
                        state: NOT_REQUESTED
                        reason: RUN_OPERATION
                        warmupRounds: 2
                        measuredRounds: 5
                        measurementScope: ALL_TEST_SUITES
                        measurementTrust: SANDBOX_EXTERNAL
                        metrics: null
                      gradingIntegrity: HOST_TESTS_IN_PARTICIPANT_SANDBOX
                run-wrong-answer:
                  value:
                    requestId: run-001
                    taskVersionId: task-v2
                    contractVersion: 1.0.0-draft.2
                    result:
                      status: WRONG_ANSWER
                      passedTests: 0
                      totalTests: 1
                      testResults:
                      - testId: public-1
                        suiteId: public-suite
                        visibility: PUBLIC
                        status: WRONG_ANSWER
                        input:
                          text: codelobby
                        expectedOutput: 3
                        actualOutput: 2
                        stdout: null
                        stderr: null
                      compileOutput: ''
                      message: null
                      sandboxCpuTimeMs: 90.0
                      sandboxPeakMemoryBytes: 42000000
                      benchmark:
                        state: NOT_REQUESTED
                        reason: RUN_OPERATION
                        warmupRounds: 2
                        measuredRounds: 5
                        measurementScope: ALL_TEST_SUITES
                        measurementTrust: SANDBOX_EXTERNAL
                        metrics: null
                      gradingIntegrity: HOST_TESTS_IN_PARTICIPANT_SANDBOX
                run-compilation-error:
                  value:
                    requestId: run-001
                    taskVersionId: task-v2
                    contractVersion: 1.0.0-draft.2
                    result:
                      status: COMPILATION_ERROR
                      passedTests: 0
                      totalTests: 1
                      testResults:
                      - testId: public-1
                        suiteId: public-suite
                        visibility: PUBLIC
                        status: NOT_RUN
                        input: null
                        expectedOutput: null
                        actualOutput: null
                        stdout: null
                        stderr: null
                      compileOutput: 'src/Solution.java:3: error: missing return statement'
                      message: null
                      sandboxCpuTimeMs: null
                      sandboxPeakMemoryBytes: null
                      benchmark:
                        state: NOT_REQUESTED
                        reason: RUN_OPERATION
                        warmupRounds: 2
                        measuredRounds: 5
                        measurementScope: ALL_TEST_SUITES
                        measurementTrust: SANDBOX_EXTERNAL
                        metrics: null
                      gradingIntegrity: HOST_TESTS_IN_PARTICIPANT_SANDBOX
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '504':
          $ref: '#/components/responses/504'
  /internal/v1/evaluation-jobs:
    post:
      operationId: submitEvaluation
      summary: Queue public and hidden test evaluation
      tags:
      - Evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            examples:
              submit-request:
                value:
                  taskVersionId: task-v2
                  language: JAVA
                  taskFiles:
                  - *id001
                  - *id002
                  - *id003
                  - path: tests/HiddenTests.java
                    type: HIDDEN_TEST
                    content: "import java.nio.file.Files;\nimport java.nio.file.Path;\n\
                      public class HiddenTests {\n    public static void main(String[]\
                      \ args) throws Exception {\n        int actual = Solution.countVowels(\"\
                      aeiou\");\n        String status = actual == 5 ? \"ACCEPTED\"\
                      \ : \"WRONG_ANSWER\";\n        String record = \"{\\\"testId\\\
                      \":\\\"hidden-1\\\",\\\"status\\\":\\\"\" + status\n       \
                      \     + \"\\\",\\\"input\\\":{\\\"text\\\":\\\"aeiou\\\"},\\\
                      \"expectedOutput\\\":5,\\\"actualOutput\\\":\" + actual + \"\
                      }\\n\";\n        Files.writeString(Path.of(System.getenv(\"\
                      CODELOBBY_REPORT_PATH\")), record);\n    }\n}\n"
                  submissionFiles:
                  - path: src/Solution.java
                    content: "public class Solution {\n    public static int countVowels(String\
                      \ text) { return Helpers.count(text); }\n}\n"
                  testSuites:
                  - *id004
                  - suiteId: hidden-suite
                    visibility: HIDDEN
                    testFilePaths:
                    - tests/HiddenTests.java
                    execution:
                      profile: JAVA_MAIN
                      mainClass: HiddenTests
                    cases:
                    - testId: hidden-1
                  limits:
                    cpuTimeMs: 2000
                    wallTimeMs: 5000
                    memoryLimitBytes: 128000000
                  submissionId: submission-001
