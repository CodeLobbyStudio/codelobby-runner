components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-CodeLobby-Internal-Key
      description: At least 32 random characters, preferably 32 random bytes encoded
        for transport. Never send to browsers or commit to Git.
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    Verdict:
      type: string
      enum:
      - ACCEPTED
      - WRONG_ANSWER
      - COMPILATION_ERROR
      - RUNTIME_ERROR
      - TIME_LIMIT_EXCEEDED
      - MEMORY_LIMIT_EXCEEDED
      - OUTPUT_LIMIT_EXCEEDED
      - EXECUTION_ERROR
    TestVerdict:
      type: string
      enum:
      - ACCEPTED
      - WRONG_ANSWER
      - RUNTIME_ERROR
      - TIME_LIMIT_EXCEEDED
      - MEMORY_LIMIT_EXCEEDED
      - OUTPUT_LIMIT_EXCEEDED
      - EXECUTION_ERROR
      - NOT_RUN
    Diagnostics:
      anyOf:
      - type: string
        maxLength: 65536
        description: At most 65536 UTF-8 bytes. Null means unavailable or redacted,
          not an empty stream. Exclude public and hidden test source, test paths,
          assertion implementations and harness traces. Return null when disclosure-safe
          separation is not reliable; shared-sandbox runtime secrecy is not guaranteed.
      - type: 'null'
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - INVALID_SOURCE_FILES
          - UNAUTHORIZED
          - JOB_NOT_FOUND
          - SUBMISSION_ID_CONFLICT
          - PAYLOAD_TOO_LARGE
          - QUEUE_CAPACITY_EXCEEDED
          - EXECUTION_UNAVAILABLE
          - REQUEST_DEADLINE_EXCEEDED
          - INTERNAL_SERVER_ERROR
          - EXECUTION_INFRASTRUCTURE_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      description: Safe generic message, without source code, test data, credentials
        or raw engine diagnostics.
    Language:
      type: string
      enum:
      - JAVA
      - CPP
      - PYTHON
    FileType:
      description: EDITABLE and READ_ONLY source may be shown to participants.
        VISIBLE_TEST identifies public feedback, not visible source. Both VISIBLE_TEST
        and HIDDEN_TEST source are backend-to-runner only and cannot be overridden.
      type: string
      enum:
      - EDITABLE
      - READ_ONLY
      - VISIBLE_TEST
      - HIDDEN_TEST
    RelativePath:
      type: string
      minLength: 1
      maxLength: 240
      pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
      description: Canonical POSIX relative path. Additional traversal, reserved-name,
        case-fold collision and sandbox-root checks in CONTRACT.md are mandatory.
    TaskFile:
      description: Authoritative internal file. Backend must omit both test-source
        roles from participant APIs, downloads and browser payloads.
      type: object
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/RelativePath'
        type:
          $ref: '#/components/schemas/FileType'
        content:
          type: string
          maxLength: 131072
          description: UTF-8 host-authored task file. Enforce 131072 bytes per file
            and 1048576 bytes per assembled project in addition to character limits.
      required:
      - path
      - type
      - content
    SubmissionFile:
      type: object
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/RelativePath'
        content:
          type: string
          maxLength: 131072
      required:
      - path
      - content
      description: Participant override of an existing EDITABLE path only; omission
        preserves the host starter file. Types cannot be supplied or changed.
    TestCaseDefinition:
      type: object
      additionalProperties: false
      properties:
        testId:
          $ref: '#/components/schemas/Identifier'
      required:
      - testId
      description: Stable case ID reported by the host test program. Inputs/assertions
        and signatures live in the host files, not in a fixed function adapter.
    JavaExecution:
      type: object
      additionalProperties: false
      properties:
        profile:
          const: JAVA_MAIN
          type: string
        mainClass:
          type: string
          minLength: 1
          maxLength: 240
          pattern: ^[A-Za-z_$][A-Za-z0-9_$]*(\.[A-Za-z_$][A-Za-z0-9_$]*)*$
      required:
      - profile
      - mainClass
    CppExecution:
      type: object
      additionalProperties: false
      properties:
        profile:
          const: CPP_MAIN
          type: string
        mainSourcePath:
          $ref: '#/components/schemas/RelativePath'
      required:
      - profile
      - mainSourcePath
    PythonExecution:
      type: object
      additionalProperties: false
      properties:
        profile:
          const: PYTHON_SCRIPT
          type: string
        scriptPath:
          $ref: '#/components/schemas/RelativePath'
      required:
      - profile
      - scriptPath
    ExecutionProfile:
      oneOf:
      - $ref: '#/components/schemas/JavaExecution'
      - $ref: '#/components/schemas/CppExecution'
      - $ref: '#/components/schemas/PythonExecution'
    TestSuite:
      type: object
      additionalProperties: false
      properties:
        suiteId:
          $ref: '#/components/schemas/Identifier'
        visibility:
          type: string
          enum:
          - PUBLIC
          - HIDDEN
        testFilePaths:
          type: array
          items:
            $ref: '#/components/schemas/RelativePath'
          minItems: 1
          maxItems: 50
        execution:
          $ref: '#/components/schemas/ExecutionProfile'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/TestCaseDefinition'
          minItems: 1
          maxItems: 50
      required:
      - suiteId
      - visibility
      - testFilePaths
      - execution
      - cases
      description: A host-defined test target. Its test paths must match its visibility.
        Total cases across suites is at most 50. No client shell commands or dependency
        installation.
    Limits:
      type: object
      additionalProperties: false
      properties:
        cpuTimeMs:
          type: integer
          minimum: 1
          maximum: 2000
        wallTimeMs:
          type: integer
          minimum: 1
          maximum: 5000
        memoryLimitBytes:
          type: integer
          minimum: 16000000
          maximum: 128000000
      required:
      - cpuTimeMs
      - wallTimeMs
      - memoryLimitBytes
      description: 'Required aggregate evaluation budgets across selected suites:
        sum of sandbox CPU and sandbox wall durations, maximum process peak memory.
        wallTimeMs >= cpuTimeMs. Compilation uses separate bounded budgets; each benchmark
        round gets a fresh evaluation budget.'
    RunRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        taskVersionId:
          $ref: '#/components/schemas/Identifier'
        language:
          $ref: '#/components/schemas/Language'
        taskFiles:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                $ref: '#/components/schemas/RelativePath'
              type:
                type: string
                enum:
                - EDITABLE
                - READ_ONLY
                - VISIBLE_TEST
              content:
                type: string
                maxLength: 131072
                description: UTF-8 host-authored task file. Enforce 131072 bytes per
                  file and 1048576 bytes per assembled project in addition to character
                  limits.
            required:
            - path
            - type
            - content
          minItems: 2
          maxItems: 50
        submissionFiles:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionFile'
          minItems: 0
          maxItems: 50
        testSuites:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              suiteId:
                $ref: '#/components/schemas/Identifier'
              visibility:
                type: string
                const: PUBLIC
              testFilePaths:
                type: array
                items:
                  $ref: '#/components/schemas/RelativePath'
                minItems: 1
                maxItems: 50
              execution:
                $ref: '#/components/schemas/ExecutionProfile'
              cases:
                type: array
                items:
                  $ref: '#/components/schemas/TestCaseDefinition'
                minItems: 1
                maxItems: 50
            required:
            - suiteId
            - visibility
            - testFilePaths
            - execution
            - cases
            description: A host-defined test target. Its test paths must match its
              visibility. Total cases across suites is at most 50. No client shell
              commands or dependency installation.
          minItems: 1
          maxItems: 50
        limits:
          $ref: '#/components/schemas/Limits'
      required:
      - requestId
      - taskVersionId
      - language
      - taskFiles
      - submissionFiles
      - testSuites
      - limits
      description: One selected language and its independent host manifest. Backend
        sends authoritative files and overlays participant edits only on EDITABLE
        paths. Global uniqueness, language/profile matching and file references are
        normative semantic checks. This internal payload includes test source;
        backend must not forward it to participant clients. Public descriptions
        are backend-owned metadata joined to results by testId.
    SubmitRequest:
      type: object
      additionalProperties: false
      properties:
        submissionId:
          $ref: '#/components/schemas/Identifier'
        taskVersionId:
          $ref: '#/components/schemas/Identifier'
        language:
          $ref: '#/components/schemas/Language'
        taskFiles:
          type: array
          items:
            $ref: '#/components/schemas/TaskFile'
          minItems: 2
          maxItems: 50
        submissionFiles:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionFile'
          minItems: 0
          maxItems: 50
        testSuites:
          type: array
          items:
            $ref: '#/components/schemas/TestSuite'
          minItems: 1
          maxItems: 50
        limits:
          $ref: '#/components/schemas/Limits'
      required:
      - submissionId
      - taskVersionId
      - language
      - taskFiles
      - submissionFiles
      - testSuites
      - limits
      description: One selected language and its independent host manifest. Backend
        sends authoritative files and overlays participant edits only on EDITABLE
        paths. Global uniqueness, language/profile matching and file references are
        normative semantic checks. This internal payload includes test source;
        backend must not forward it to participant clients. Public descriptions
        are backend-owned metadata joined to results by testId.
    PublicTestResult:
      type: object
      additionalProperties: false
      properties:
        testId:
          $ref: '#/components/schemas/Identifier'
        suiteId:
          $ref: '#/components/schemas/Identifier'
        visibility:
          type: string
          const: PUBLIC
        status:
          $ref: '#/components/schemas/TestVerdict'
        input: &id009
          description: Any JSON value, including null. At most 100000 UTF-8 bytes
            in compact serialization; no non-finite numbers.
        expectedOutput: *id009
        actualOutput: *id009
        stdout:
          $ref: '#/components/schemas/Diagnostics'
        stderr:
          $ref: '#/components/schemas/Diagnostics'
      required:
      - testId
      - suiteId
      - visibility
      - status
      - input
      - expectedOutput
      - actualOutput
      - stdout
      - stderr
      description: Public feedback does not grant test-source access. Backend joins
        its public names/descriptions by testId; no description field is sent through
        the runner. Input/expected/actual values may be shown as public case data.
        Omit test-source excerpts and harness implementation from all diagnostics;
        use null when absent, unsafe or not safely attributable. Status is mandatory.
        Every schema field is always present. Shared-sandbox runtime secrecy is limited.
    HiddenTestResult:
      type: object
      additionalProperties: false
      properties:
        testId:
          $ref: '#/components/schemas/Identifier'
        suiteId:
          $ref: '#/components/schemas/Identifier'
        visibility:
          type: string
          const: HIDDEN
        status:
          $ref: '#/components/schemas/TestVerdict'
        input:
          type: 'null'
        expectedOutput:
          type: 'null'
        actualOutput:
          type: 'null'
        stdout:
          type: 'null'
        stderr:
          type: 'null'
      required:
      - testId
      - suiteId
      - visibility
      - status
      - input
      - expectedOutput
      - actualOutput
      - stdout
      - stderr
    TestResult:
      oneOf:
      - $ref: '#/components/schemas/PublicTestResult'
      - $ref: '#/components/schemas/HiddenTestResult'
    HarnessRecord:
      type: object
      additionalProperties: false
      properties:
        testId:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum:
          - ACCEPTED
          - WRONG_ANSWER
          - RUNTIME_ERROR
        input: *id009
        expectedOutput: *id009
        actualOutput: *id009
      required:
      - testId
      - status
      description: 'Host test report inside the sandbox: one UTF-8 NDJSON record per
        declared case on the dedicated report channel. Omitted optional values become
        null. This report is not a trusted sandbox escape boundary; see gradingIntegrity.'
    BenchmarkMetrics:
      type: object
      additionalProperties: false
      properties:
        runtimeMs:
          type: number
          minimum: 0
          description: Median sum of externally measured sandbox CPU times across
            all suites per measured round. Includes host test runner and language
            startup overhead; excludes compilation and queueing.
        sandboxCpuTimeMs:
          type: number
          minimum: 0
          description: Same external CPU median as runtimeMs in this revision; retained
            as an explicit source field.
        peakMemoryBytes:
          type: integer
          minimum: 0
        roundRuntimeMs:
          type: array
          items:
            type: number
            minimum: 0
          minItems: 5
          maxItems: 5
        roundSandboxCpuTimeMs:
          type: array
          items:
            type: number
            minimum: 0
          minItems: 5
          maxItems: 5
        roundPeakMemoryBytes:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 5
          maxItems: 5
      required:
      - runtimeMs
      - sandboxCpuTimeMs
      - peakMemoryBytes
      - roundRuntimeMs
      - roundSandboxCpuTimeMs
      - roundPeakMemoryBytes
    Benchmark:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - NOT_REQUESTED
          - SKIPPED
          - SUCCEEDED
          - FAILED
        reason:
          anyOf:
          - type: string
            enum:
            - RUN_OPERATION
            - EVALUATION_NOT_ACCEPTED
            - MEASUREMENT_UNAVAILABLE
            - BUDGET_EXCEEDED
            - INFRASTRUCTURE_FAILURE
          - type: 'null'
        warmupRounds:
          type: integer
          const: 2
        measuredRounds:
          type: integer
          const: 5
        measurementScope:
          type: string
          const: ALL_TEST_SUITES
        measurementTrust:
          type: string
          const: SANDBOX_EXTERNAL
        metrics:
          anyOf:
          - $ref: '#/components/schemas/BenchmarkMetrics'
          - type: 'null'
      required:
      - state
      - reason
      - warmupRounds
      - measuredRounds
      - measurementScope
      - measurementTrust
      - metrics
      allOf:
      - if:
          properties:
            state:
              const: SUCCEEDED
        then:
          properties:
            reason:
              type: 'null'
            metrics:
              $ref: '#/components/schemas/BenchmarkMetrics'
      - if:
          properties:
            state:
              enum:
              - NOT_REQUESTED
              - SKIPPED
              - FAILED
        then:
          properties:
            metrics:
              type: 'null'
            reason:
              type: string
    RunResult:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/Verdict'
        passedTests:
          type: integer
          minimum: 0
          maximum: 50
        totalTests:
          type: integer
          minimum: 1
          maximum: 50
        testResults:
          type: array
          items:
            $ref: '#/components/schemas/PublicTestResult'
          minItems: 1
          maxItems: 50
        compileOutput:
          $ref: '#/components/schemas/Diagnostics'
          description: Only sanitized public-suite diagnostics about participant-visible
            sources; no test-source excerpts, test paths or harness implementation.
            Null when safe separation is unreliable or hidden builds are involved.
        message:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        sandboxCpuTimeMs:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        sandboxPeakMemoryBytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        benchmark:
          $ref: '#/components/schemas/Benchmark'
        gradingIntegrity:
          type: string
          const: HOST_TESTS_IN_PARTICIPANT_SANDBOX
      required:
      - status
      - passedTests
      - totalTests
      - testResults
      - compileOutput
      - message
      - sandboxCpuTimeMs
      - sandboxPeakMemoryBytes
      - benchmark
      - gradingIntegrity
      description: One result per declared case in suite/case request order. Host
        assertions determine correctness; runner verifies report completeness and
        enforces resources externally. Host test code sharing a sandbox with participant
        code is not tamper-proof.
    EvaluationResult:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/Verdict'
        passedTests:
          type: integer
          minimum: 0
          maximum: 50
        totalTests:
          type: integer
          minimum: 1
          maximum: 50
        testResults:
          type: array
          items:
            $ref: '#/components/schemas/TestResult'
          minItems: 1
          maxItems: 50
        compileOutput:
          $ref: '#/components/schemas/Diagnostics'
          description: Only sanitized public-suite diagnostics about participant-visible
            sources; no test-source excerpts, test paths or harness implementation.
            Null when safe separation is unreliable or hidden builds are involved.
        message:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        sandboxCpuTimeMs:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        sandboxPeakMemoryBytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        benchmark:
          $ref: '#/components/schemas/Benchmark'
        gradingIntegrity:
          type: string
          const: HOST_TESTS_IN_PARTICIPANT_SANDBOX
      required:
      - status
      - passedTests
      - totalTests
      - testResults
      - compileOutput
      - message
      - sandboxCpuTimeMs
      - sandboxPeakMemoryBytes
      - benchmark
      - gradingIntegrity
      description: One result per declared case in suite/case request order. Host
        assertions determine correctness; runner verifies report completeness and
        enforces resources externally. Host test code sharing a sandbox with participant
        code is not tamper-proof.
    RunResponse:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/Identifier'
        taskVersionId:
          $ref: '#/components/schemas/Identifier'
        contractVersion:
          type: string
          const: 1.0.0-draft.2
        result:
          $ref: '#/components/schemas/RunResult'
      required:
      - requestId
      - taskVersionId
      - contractVersion
      - result
    Job:
      type: object
      additionalProperties: false
      properties:
        submissionId:
          $ref: '#/components/schemas/Identifier'
        taskVersionId:
          $ref: '#/components/schemas/Identifier'
        contractVersion:
          type: string
          const: 1.0.0-draft.2
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - FINISHED
          - FAILED
        createdAt:
          type: string
          format: date-time
          description: UTC RFC 3339 timestamp ending in Z.
        startedAt:
          anyOf:
          - type: string
            format: date-time
            description: UTC RFC 3339 timestamp ending in Z.
          - type: 'null'
        finishedAt:
          anyOf:
          - type: string
            format: date-time
            description: UTC RFC 3339 timestamp ending in Z.
          - type: 'null'
        expiresAt:
          anyOf:
          - type: string
            format: date-time
            description: UTC RFC 3339 timestamp ending in Z.
          - type: 'null'
        result:
          anyOf:
          - $ref: '#/components/schemas/EvaluationResult'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - submissionId
      - taskVersionId
      - contractVersion
      - state
      - createdAt
      - startedAt
      - finishedAt
      - expiresAt
      - result
      - error
      allOf:
      - if:
          properties:
            state:
              const: QUEUED
        then:
          properties:
            startedAt:
              type: 'null'
            finishedAt:
              type: 'null'
            expiresAt:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
      - if:
          properties:
            state:
              const: RUNNING
        then:
          properties:
            startedAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            finishedAt:
              type: 'null'
            expiresAt:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
      - if:
          properties:
            state:
              const: FINISHED
        then:
          properties:
            startedAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            finishedAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            expiresAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            result:
              $ref: '#/components/schemas/EvaluationResult'
            error:
              type: 'null'
      - if:
          properties:
            state:
              const: FAILED
        then:
          properties:
            finishedAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            expiresAt:
              type: string
              format: date-time
              description: UTC RFC 3339 timestamp ending in Z.
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/Error'
    LanguageCapability:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: '#/components/schemas/Language'
        version:
          type: string
          minLength: 1
        languageStandard:
          type: string
          minLength: 1
        executionProfiles:
          type: array
          items:
            type: string
            enum:
            - JAVA_MAIN
            - CPP_MAIN
            - PYTHON_SCRIPT
          minItems: 1
          maxItems: 3
        supportedFileTypes:
          type: array
          items:
            $ref: '#/components/schemas/FileType'
          minItems: 4
          maxItems: 4
        supportsMultipleFiles:
          type: boolean
          const: true
        builtinLibraries:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
          maxItems: 50
      required:
      - language
      - version
      - languageStandard
      - executionProfiles
      - supportedFileTypes
      - supportsMultipleFiles
      - builtinLibraries
      description: Only verified deployed languages are advertised; planned support
        is not readiness. Version is the actual compiler/interpreter version. No on-demand
        library installation.
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        contractVersion:
          type: string
          const: 1.0.0-draft.2
        environmentId:
          $ref: '#/components/schemas/Identifier'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCapability'
          minItems: 1
          maxItems: 3
        defaultLimits:
          $ref: '#/components/schemas/Limits'
        maxLimits:
          $ref: '#/components/schemas/Limits'
        compilationLimits:
          type: object
          additionalProperties: false
          properties:
            cpuTimeMs:
              type: integer
              minimum: 1
            wallTimeMs:
              type: integer
              minimum: 1
            memoryLimitBytes:
              type: integer
              minimum: 1
          required:
          - cpuTimeMs
          - wallTimeMs
          - memoryLimitBytes
        maxRequestBytes:
          type: integer
          const: 2000000
        maxTests:
          type: integer
          const: 50
        maxStdoutBytes:
          type: integer
          const: 65536
        maxStderrBytes:
          type: integer
          const: 65536
        maxCompileOutputBytes:
          type: integer
          const: 65536
        queue:
          type: object
          additionalProperties: false
          properties:
            maxConcurrentExecutions:
              type: integer
              const: 1
            maxPendingExecutions:
              type: integer
              const: 10
            maxStoredJobs:
              type: integer
              const: 100
            resultRetentionSeconds:
              type: integer
              const: 1800
            durable:
              type: boolean
              const: false
          required:
          - maxConcurrentExecutions
          - maxPendingExecutions
          - maxStoredJobs
          - resultRetentionSeconds
          - durable
        runDeadlineMs:
          type: integer
          const: 60000
        jobDeadlineMs:
          type: integer
          const: 180000
        benchmarkPolicy:
          type: object
          additionalProperties: false
          properties:
            enabledForAcceptedSubmissions:
              type: boolean
              const: true
            warmupRounds:
              type: integer
              const: 2
            measuredRounds:
              type: integer
              const: 5
            roundLimitScope:
              type: string
              const: ALL_SELECTED_SUITES
            measurementTrust:
              type: string
              const: SANDBOX_EXTERNAL
          required:
          - enabledForAcceptedSubmissions
          - warmupRounds
          - measuredRounds
          - roundLimitScope
          - measurementTrust
        maxTaskFiles:
          type: integer
          const: 50
        maxFileBytes:
          type: integer
          const: 131072
        maxProjectBytes:
          type: integer
          const: 1048576
        maxDiagnosticValueBytes:
          type: integer
          const: 100000
        maxReportBytes:
          type: integer
          const: 1000000
        maxReportLineBytes:
          type: integer
          const: 310000
        maxPathCharacters:
          type: integer
          const: 240
        reportProtocol:
          type: string
          const: CODELOBBY_NDJSON_V1
        gradingIntegrity:
          type: string
          const: HOST_TESTS_IN_PARTICIPANT_SANDBOX
        limitsScope:
          type: string
          const: ALL_SELECTED_SUITES
      required:
      - contractVersion
      - environmentId
      - languages
      - defaultLimits
      - maxLimits
      - compilationLimits
      - maxRequestBytes
      - maxTests
      - maxStdoutBytes
      - maxStderrBytes
      - maxCompileOutputBytes
      - queue
      - runDeadlineMs
      - jobDeadlineMs
      - benchmarkPolicy
      - maxTaskFiles
      - maxFileBytes
      - maxProjectBytes
      - maxDiagnosticValueBytes
      - maxReportBytes
      - maxReportLineBytes
      - maxPathCharacters
      - reportProtocol
      - gradingIntegrity
      - limitsScope
  responses:
    '400':
      description: INVALID_REQUEST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: Invalid request.
            retryable: false
    '401':
      description: UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Unauthorized.
            retryable: false
    '404':
      description: JOB_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: JOB_NOT_FOUND
            message: Job not found.
            retryable: false
    '409':
      description: SUBMISSION_ID_CONFLICT
      content:
